<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsaacLab Controller</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <div class="app-container">
        <!-- 헤더 -->
        <header class="header">
            <h1>🎮 IsaacLab Controller</h1>
            <div class="connection-status" id="connectionStatus">
                <span class="status-dot disconnected"></span>
                <span>연결 끊김</span>
            </div>
        </header>

        <!-- 메인 컨텐츠 -->
        <main class="main-content">
            <!-- 왼쪽: 영상 미리보기 -->
            <section class="preview-section">
                <div class="preview-container">
                    <img id="previewImage" src="" alt="시뮬레이션 미리보기">
                    <div class="preview-overlay" id="previewOverlay">
                        <p>스트리밍 연결 중...</p>
                    </div>
                </div>
                <div class="preview-controls">
                    <button id="btnSnapshot" class="btn btn-secondary">📷 스냅샷</button>
                    <button id="btnToggleStream" class="btn btn-primary">⏸️ 스트림 일시정지</button>
                </div>
            </section>

            <!-- 오른쪽: 제어 패널 -->
            <aside class="control-panel">
                <!-- 탭 메뉴 -->
                <div class="tab-menu">
                    <button class="tab-btn active" data-tab="camera">📷 카메라</button>
                    <button class="tab-btn" data-tab="objects">📦 물체</button>
                    <button class="tab-btn" data-tab="materials">🎨 재질</button>
                </div>

                <!-- 카메라 탭 -->
                <div class="tab-content active" id="tab-camera">
                    <h3>카메라 제어</h3>

                    <div class="control-group">
                        <label>카메라 선택</label>
                        <select id="cameraSelect">
                            <option value="">로딩 중...</option>
                        </select>
                        <button id="btnRefreshCameras" class="btn btn-secondary">🔄</button>
                    </div>

                    <div class="control-group">
                        <label>Orbit 제어</label>
                        <div class="slider-group">
                            <label>수평 (Azimuth): <span id="azimuthValue">0</span>°</label>
                            <input type="range" id="azimuth" min="0" max="360" value="0">
                        </div>
                        <div class="slider-group">
                            <label>수직 (Elevation): <span id="elevationValue">30</span>°</label>
                            <input type="range" id="elevation" min="-90" max="90" value="30">
                        </div>
                        <div class="slider-group">
                            <label>거리: <span id="distanceValue">2.0</span>m</label>
                            <input type="range" id="distance" min="0.5" max="10" value="2" step="0.1">
                        </div>
                    </div>

                    <div class="control-group">
                        <label>위치 직접 입력</label>
                        <div class="input-row">
                            <input type="number" id="camX" placeholder="X" step="0.1" value="1.5">
                            <input type="number" id="camY" placeholder="Y" step="0.1" value="0">
                            <input type="number" id="camZ" placeholder="Z" step="0.1" value="0.6">
                        </div>
                        <button id="btnSetPosition" class="btn btn-primary">위치 적용</button>
                    </div>

                    <div class="control-group">
                        <label>타겟 위치</label>
                        <div class="input-row">
                            <input type="number" id="targetX" placeholder="X" step="0.1" value="0">
                            <input type="number" id="targetY" placeholder="Y" step="0.1" value="0">
                            <input type="number" id="targetZ" placeholder="Z" step="0.1" value="0">
                        </div>
                        <button id="btnSetTarget" class="btn btn-primary">타겟 적용</button>
                    </div>
                </div>

                <!-- 물체 탭 -->
                <div class="tab-content" id="tab-objects">
                    <h3>물체 관리</h3>

                    <div class="control-group">
                        <label>새 물체 추가</label>
                        <select id="objectType">
                            <option value="box">📦 박스</option>
                            <option value="sphere">🔴 구</option>
                            <option value="cylinder">🥫 원통</option>
                            <option value="cone">🔺 원뿔</option>
                        </select>
                        <div class="input-row">
                            <input type="number" id="objX" placeholder="X" step="0.1" value="0">
                            <input type="number" id="objY" placeholder="Y" step="0.1" value="0">
                            <input type="number" id="objZ" placeholder="Z" step="0.1" value="0.5">
                        </div>
                        <button id="btnSpawnObject" class="btn btn-success">➕ 물체 추가</button>
                    </div>

                    <div class="control-group">
                        <label>현재 물체 목록</label>
                        <div class="object-list" id="objectList">
                            <p class="empty-message">물체가 없습니다.</p>
                        </div>
                        <button id="btnRefreshObjects" class="btn btn-secondary">🔄 새로고침</button>
                    </div>
                </div>

                <!-- 재질 탭 -->
                <div class="tab-content" id="tab-materials">
                    <h3>재질 관리</h3>

                    <div class="control-group">
                        <label>새 재질 생성</label>
                        <input type="text" id="materialName" placeholder="재질 이름">
                        <div class="color-picker">
                            <label>색상:</label>
                            <input type="color" id="materialColor" value="#ff4444">
                        </div>
                        <div class="slider-group">
                            <label>거칠기: <span id="roughnessValue">0.5</span></label>
                            <input type="range" id="roughness" min="0" max="1" value="0.5" step="0.1">
                        </div>
                        <div class="slider-group">
                            <label>금속성: <span id="metallicValue">0.0</span></label>
                            <input type="range" id="metallic" min="0" max="1" value="0" step="0.1">
                        </div>
                        <button id="btnCreateMaterial" class="btn btn-success">➕ 재질 생성</button>
                    </div>

                    <div class="control-group">
                        <label>프리셋 재질</label>
                        <div class="preset-materials" id="presetMaterials">
                            <!-- 동적으로 채워짐 -->
                        </div>
                    </div>

                    <div class="control-group">
                        <label>재질 적용</label>
                        <select id="targetObject">
                            <option value="">물체 선택...</option>
                        </select>
                        <select id="selectedMaterial">
                            <option value="">재질 선택...</option>
                        </select>
                        <button id="btnBindMaterial" class="btn btn-primary">✅ 재질 적용</button>
                    </div>
                </div>
            </aside>
        </main>

        <!-- 푸터 -->
        <footer class="footer">
            <p>IsaacLab Controller v0.1.0</p>
        </footer>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
