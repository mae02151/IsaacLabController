# Digital Twin 예제 설정

server:
  host: "0.0.0.0"
  port: 8000

streaming:
  fps: 30
  quality: 85

assets:
  objects:
    - name: "cracker_box"
      usd_path: "${ISAAC_NUCLEUS_DIR}/Props/YCB/Axis_Aligned/003_cracker_box.usd"
      type: usd
    - name: "box"
      type: primitive
    - name: "sphere"
      type: primitive
    - name: "cylinder"
      type: primitive
    - name: "cone"
      type: primitive

  materials:
    - name: "red_plastic"
      color: [1.0, 0.2, 0.2]
      roughness: 0.3
      metallic: 0.0
    - name: "blue_plastic"
      color: [0.2, 0.2, 1.0]
      roughness: 0.3
      metallic: 0.0
    - name: "metal_silver"
      color: [0.8, 0.8, 0.8]
      roughness: 0.2
      metallic: 0.9
    - name: "wood"
      color: [0.55, 0.27, 0.07]
      roughness: 0.7
      metallic: 0.0
